name: Download Docker Image
on: [workflow_dispatch]

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          
      - name: Pull and Save Images
        run: |
          docker pull prom/blackbox-exporter:0.28.0
          docker pull prom/prometheus:v3.11.2
          docker pull prom/alertmanager:v0.32.0
          docker pull grafana/grafana:12.4.2
          docker save -o monitor_images.tar prom/blackbox-exporter:0.28.0 prom/prometheus:v3.11.2 prom/alertmanager:v0.32.0 grafana/grafana:12.4.2
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: monitor_images
          path: monitor_images.tar
