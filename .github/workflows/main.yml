name: Download Docker Images

on:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 关键步骤：配置国内镜像加速器（解决 404 和限流）
      - name: Configure Docker Mirror
        run: |
          sudo mkdir -p /etc/docker
          echo '{
            "registry-mirrors": [
              "https://docker.m.daocloud.io",
              "https://docker.1ms.run"
            ]
          }' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker

      # 使用加速源拉取镜像
      - name: Pull images via China mirrors
        run: |
          docker pull docker.m.daocloud.io/prom/prometheus-webhook-wechat:latest
          docker pull docker.m.daocloud.io/rea1shane/a2w:latest

          # 重新打 tag（去掉加速前缀，方便后续使用）
          docker tag docker.m.daocloud.io/prom/prometheus-webhook-wechat:latest prom/prometheus-webhook-wechat:latest
          docker tag docker.m.daocloud.io/rea1shane/a2w:latest rea1shane/a2w:latest

      # 合并打包成一个 tar 文件
      - name: Save images into one tar file
        run: |
          docker save \
            prom/prometheus-webhook-wechat:latest \
            rea1shane/a2w:latest \
            -o docker-images-all.tar

      # 上传到 Releases
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: docker-images-${{ github.run_number }}
          name: Docker Images ${{ github.run_number }}
          body: |
            ## 📦 离线镜像包（已解决 404 问题）

            包含以下镜像：
            - prom/prometheus-webhook-wechat:latest
            - rea1shane/a2w:latest

            ### 🚀 使用方法
