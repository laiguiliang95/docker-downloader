steps:
  - name: Checkout
    uses: actions/checkout@v4

  # 核心步骤：直接拉取 GHCR 上的镜像 (GitHub 自带，无限速)
  - name: Pull images from GitHub Packages
    run: |
      # 直接从 ghcr.io 拉取 (不需要配置任何加速器，也不需要登录 Docker Hub)
      docker pull ghcr.io/prom/prometheus-webhook-wechat:latest
      docker pull ghcr.io/rea1shane/a2w:latest

  # 打包成一个 tar 文件
  - name: Save images into one tar file
    run: |
      docker save \
        ghcr.io/prom/prometheus-webhook-wechat:latest \
        ghcr.io/rea1shane/a2w:latest \
        -o docker-images-all.tar

  # 上传到 Releases 供下载
  - name: Create Release
    uses: softprops/action-gh-release@v2
    with:
      tag_name: docker-images-${{ github.run_number }}
      name: Docker Images Package
      body: |
        ## 离线镜像包 (已绕过 Docker Hub 限流)
        
        * prom/prometheus-webhook-wechat
        * rea1shane/a2w
        
        **使用方法:**
        bash
        docker load < docker-images-all.tar
        
      files: |
        docker-images-all.tar
