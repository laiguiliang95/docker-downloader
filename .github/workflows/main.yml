name: Download Docker Image
on: [workflow_dispatch]

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Pull and Save Images
        run: |
          # 拉取指定版本的 blackbox-exporter
          docker pull prom/blackbox-exporter:v0.30.0
          
          # 打包保存
          docker save -o monitor_images_v030.tar prom/blackbox-exporter:v0.30.0
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: monitor_images_v030
          path: monitor_images_v030.tar
