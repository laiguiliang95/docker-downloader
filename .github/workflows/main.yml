name: Download A2W Image (No Mirror)

on:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1. 登录 GitHub 官方镜像仓库 (无需密码，使用内置 Token)
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 2. 直接从 Docker Hub 拉取 (GitHub 海外节点直连)
      - name: Pull original image
        run: |
          docker pull rea1shane/a2w:latest

      # 3. 重新打标签，指向 GitHub 仓库
      - name: Tag for GHCR
        run: |
          docker tag rea1shane/a2w:latest ghcr.io/${{ github.repository_owner }}/a2w:latest

      # 4. 推送到 GitHub (这一步是为了缓存，确保后续下载稳定)
      - name: Push to GHCR
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/a2w:latest

      # 5. 从 GitHub 拉取并打包 (此时完全不经过 Docker Hub)
      - name: Save image
        run: |
          docker pull ghcr.io/${{ github.repository_owner }}/a2w:latest
          docker save ghcr.io/${{ github.repository_owner }}/a2w:latest -o a2w-image.tar

      # 6. 上传文件
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: a2w-docker-image
          path: a2w-image.tar
