name: Download Docker Images

on:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 不需要配置任何镜像加速器，也不需要登录 Docker Hub
      - name: Pull images directly from Docker Hub
        run: |
          docker pull magicyg/prometheus-webhook-wechat:latest
          docker pull rea1shane/a2w:latest

      - name: Save images into one tar file
        run: |
          docker save \
            magicyg/prometheus-webhook-wechat:latest \
            rea1shane/a2w:latest \
            -o docker-images-all.tar

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: docker-images-${{ github.run_number }}
          name: Docker Images ${{ github.run_number }}
          body: |
            ## 📦 离线镜像包

            已包含：
            - prometheus-webhook-wechat
            - a2w (Alertmanager to WeCom)

            ### 使用方法
