name: Download Docker Images (Stable)

on:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write  # 必须开启，用于推送镜像到 GHCR

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 登录到 GitHub Container Registry (使用内置 Token，无需密码)
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 拉取 Docker Hub 镜像，并重新打标签为 GHCR 格式
      - name: Pull and Retag Images
        run: |
          # 从 Docker Hub 拉取
          docker pull prom/prometheus-webhook-wechat:latest
          docker pull rea1shane/a2w:latest

          # 重新打标签，指向 GHCR
          docker tag prom/prometheus-webhook-wechat:latest ghcr.io/${{ github.repository_owner }}/prometheus-webhook-wechat:latest
          docker tag rea1shane/a2w:latest ghcr.io/${{ github.repository_owner }}/a2w:latest

      # 将镜像推送到 GHCR (这一步确保镜像被缓存到 GitHub 内部)
      - name: Push to GHCR
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/prometheus-webhook-wechat:latest
          docker push ghcr.io/${{ github.repository_owner }}/a2w:latest

      # 从 GHCR 拉取并打包 (此时速度极快且无限制)
      - name: Save images into one tar file
        run: |
          docker pull ghcr.io/${{ github.repository_owner }}/prometheus-webhook-wechat:latest
          docker pull ghcr.io/${{ github.repository_owner }}/a2w:latest

          docker save \
            ghcr.io/${{ github.repository_owner }}/prometheus-webhook-wechat:latest \
            ghcr.io/${{ github.repository_owner }}/a2w:latest \
            -o docker-images-all.tar

      # 创建 Release 并上传文件
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: docker-images-${{ github.run_number }}
          name: Docker Images Package ${{ github.run_number }}
          body: |
            ## 📦 离线镜像包 (已绕过 Docker Hub 限流)

            ### 包含的镜像：
            - prom/prometheus-webhook-wechat
            - rea1shane/a2w

            ### 🚀 使用方法：
