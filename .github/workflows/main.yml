name: Download Docker Images

on:
  workflow_dispatch:  # 手动触发

jobs:
  download-images:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure Docker Mirror (DaoCloud)
        run: |
          sudo mkdir -p /etc/docker
          echo '{
            "registry-mirrors": [
              "https://docker.m.daocloud.io"
            ]
          }' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker

      - name: Pull images
        run: |
          # 使用 DaoCloud 加速拉取
          docker pull docker.m.daocloud.io/magicyg/prometheus-webhook-wechat:latest
          docker pull docker.m.daocloud.io/rea1shane/a2w:latest

          # 重新打 tag（去掉加速前缀）
          docker tag docker.m.daocloud.io/magicyg/prometheus-webhook-wechat:latest magicyg/prometheus-webhook-wechat:latest
          docker tag docker.m.daocloud.io/rea1shane/a2w:latest rea1shane/a2w:latest

      - name: Save all images into one tar file
        run: |
          docker save \
            magicyg/prometheus-webhook-wechat:latest \
            rea1shane/a2w:latest \
            -o docker-images-all.tar

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: docker-images-${{ github.run_number }}
          name: Docker Images ${{ github.run_number }}
          body: |
            ## 📦 合并 Docker 镜像包

            包含以下镜像：
            - magicyg/prometheus-webhook-wechat:latest
            - rea1shane/a2w:latest

            ### 🚀 使用方法
